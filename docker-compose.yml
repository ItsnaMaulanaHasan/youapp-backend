services:
  api:
    build: .
    container_name: youapp-api
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - rabbitmq
    environment:
      - MONGO_URI=mongodb://mongo:27017/youapp
      - JWT_SECRET=supersecret
      - RABBITMQ_URL=amqp://rabbitmq:5672

  mongo:
    image: mongo
    container_name: youapp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: youapp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  mongo-data: